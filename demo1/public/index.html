<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地 RAG 知识库系统</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-message {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .typing-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .file-upload-area {
            border: 2px dashed #cbd5e0;
            transition: all 0.3s ease;
        }
        
        .file-upload-area:hover {
            border-color: #4299e1;
            background-color: #ebf8ff;
        }
        
        .file-upload-area.dragover {
            border-color: #3182ce;
            background-color: #bee3f8;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-brain text-blue-600 text-2xl mr-3"></i>
                    <h1 class="text-xl font-semibold text-gray-900">本地 RAG 知识库系统</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="status-indicator" class="flex items-center">
                        <div class="w-3 h-3 rounded-full bg-gray-400 mr-2"></div>
                        <span class="text-sm text-gray-600">检查中...</span>
                    </div>
                    <button id="refresh-btn" class="p-2 text-gray-400 hover:text-gray-600">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 主聊天区域 -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-sm border">
                    <!-- 聊天头部 -->
                    <div class="border-b px-6 py-4">
                        <h2 class="text-lg font-medium text-gray-900">智能问答</h2>
                        <p class="text-sm text-gray-500 mt-1">向知识库提问，获得基于文档的准确回答</p>
                    </div>
                    
                    <!-- 聊天消息区域 -->
                    <div id="chat-messages" class="h-96 overflow-y-auto p-6 space-y-4">
                        <div class="text-center text-gray-500 text-sm">
                            <i class="fas fa-comments text-2xl mb-2"></i>
                            <p>开始提问吧！我会根据已上传的文档来回答您的问题。</p>
                        </div>
                    </div>
                    
                    <!-- 输入区域 -->
                    <div class="border-t p-6">
                        <form id="question-form" class="flex space-x-4">
                            <div class="flex-1">
                                <input 
                                    type="text" 
                                    id="question-input" 
                                    placeholder="请输入您的问题..."
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required
                                >
                            </div>
                            <button 
                                type="submit" 
                                id="ask-btn"
                                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                <i class="fas fa-paper-plane mr-2"></i>
                                发送
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 侧边栏 -->
            <div class="space-y-6">
                <!-- 文件上传 -->
                <div class="bg-white rounded-lg shadow-sm border">
                    <div class="border-b px-6 py-4">
                        <h3 class="text-lg font-medium text-gray-900">文档管理</h3>
                        <p class="text-sm text-gray-500 mt-1">上传文本文件到知识库</p>
                    </div>
                    
                    <div class="p-6">
                        <!-- 文件上传区域 -->
                        <div id="file-upload-area" class="file-upload-area rounded-lg p-6 text-center mb-4">
                            <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                            <p class="text-sm text-gray-600 mb-2">拖拽文件到此处或点击选择</p>
                            <p class="text-xs text-gray-500">支持 .txt 文件，最大 5MB</p>
                            <input type="file" id="file-input" accept=".txt" class="hidden">
                        </div>
                        
                        <!-- 上传按钮 -->
                        <button 
                            id="upload-btn" 
                            class="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled
                        >
                            <i class="fas fa-upload mr-2"></i>
                            上传文件
                        </button>
                    </div>
                </div>

                <!-- 文件列表 -->
                <div class="bg-white rounded-lg shadow-sm border">
                    <div class="border-b px-6 py-4 flex justify-between items-center">
                        <div>
                            <h3 class="text-lg font-medium text-gray-900">已上传文件</h3>
                            <p class="text-sm text-gray-500 mt-1">管理知识库中的文档</p>
                        </div>
                        <button id="refresh-files-btn" class="p-2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    
                    <div id="files-list" class="p-6">
                        <div class="text-center text-gray-500 text-sm">
                            <i class="fas fa-folder-open text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </div>
                    </div>
                </div>

                <!-- 系统信息 -->
                <div class="bg-white rounded-lg shadow-sm border">
                    <div class="border-b px-6 py-4">
                        <h3 class="text-lg font-medium text-gray-900">系统信息</h3>
                    </div>
                    
                    <div class="p-6 space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">文档数量:</span>
                            <span id="doc-count" class="font-medium">-</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">系统状态:</span>
                            <span id="system-status" class="font-medium">-</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">最后更新:</span>
                            <span id="last-update" class="font-medium text-xs">-</span>
                        </div>
                        
                        <button 
                            id="reinitialize-btn" 
                            class="w-full mt-4 px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 text-sm"
                        >
                            <i class="fas fa-redo mr-2"></i>
                            重新初始化
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script src="app.js"></script>
</body>
</html>
